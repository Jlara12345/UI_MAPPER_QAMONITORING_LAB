# ==========================================================
# UI_MAPPER - SELECTOR REPOSITORY
# ==========================================================
# Archivo central de selectores descubiertos por UI_MAPPER.
#
# Este archivo puede iniciar vacío en un proyecto consumidor nuevo.
# Será poblado/actualizado cuando:
#
# 1. Se generen los scripts de autodescubrimiento con:
#    RunAutodescubrimiento
#
# 2. Se ejecuten los scripts generados de autodescubrimiento.
#
# Después de eso, este archivo contendrá logicalIds y selectores como:
#
# PAGE_ALIAS.ELEMENT_ALIAS.primary=...
# PAGE_ALIAS.ELEMENT_ALIAS.alt1=...
# PAGE_ALIAS.ELEMENT_ALIAS.type=...
# PAGE_ALIAS.ELEMENT_ALIAS.page=...
# PAGE_ALIAS.ELEMENT_ALIAS.scope=...
#
# ==========================================================


# ==========================================================
# ESTADO INICIAL
# ==========================================================
# Este archivo inicia vacío intencionalmente.
# No borres este archivo: el framework lo usará como repositorio central.
# ==========================================================


