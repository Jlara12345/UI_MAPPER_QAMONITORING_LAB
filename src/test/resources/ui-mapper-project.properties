# ==========================================================
# UI_MAPPER - PROJECT CONTRACT
# ==========================================================
# Este archivo es el contrato entre el proyecto consumidor
# y el framework UI_MAPPER.
#
# Antes de ejecutar el Pipeline de Generación, actualiza los
# valores marcados como CAMBIAR_SEGUN_PROYECTO.
#
# Pipeline principal:
# 1. RunSetupValidation AUTODISCOVERY
# 2. RunAutodescubrimiento
# 3. Ejecutar scripts generados de autodescubrimiento
# 4. RunPomGeneration
# 5. RunBusinessAliasGeneration
# 6. Copiar/validar aliases generados en este archivo
# 7. RunSetupValidation BUSINESS
# 8. RunBusiness
# 9. Ejecutar scripts de negocio generados
# ==========================================================


# ==========================================================
# IDENTIDAD DEL PROYECTO
# ==========================================================
# Nombre lógico del proyecto consumidor.
project.name=CAMBIAR_SEGUN_PROYECTO

# Nombre de la aplicación bajo prueba.
project.applicationName=CAMBIAR_SEGUN_PROYECTO

# Nombre del módulo funcional o técnico.
project.moduleName=CAMBIAR_SEGUN_PROYECTO


# ==========================================================
# NAVEGACIÓN / APLICACIÓN
# ==========================================================
# URL base de la aplicación bajo prueba.
# Ejemplo:
# project.baseUrl=http://localhost:4200
project.baseUrl=http://localhost:4200

# Base lógica usada para construir PageIds.
# Ejemplo:
# project.pageBase=features
project.pageBase=features


# ==========================================================
# FEATURES DE AUTODESCUBRIMIENTO
# ==========================================================
# Carpeta donde se colocan los .feature de autodiscovery.
project.features.directory=src/test/resources/features/autodiscovery


# ==========================================================
# SELECTOR REPOSITORY
# ==========================================================
# Archivo central donde UI_MAPPER registra los selectores descubiertos.
#
# Este archivo puede iniciar vacío y será actualizado cuando se ejecuten
# los scripts generados de autodescubrimiento.
project.selector.definitionFile=src/test/resources/selectors/SELECTOR_REPOSITORY.properties

# Rutas auxiliares para repository/specs.
# Se pueden usar para metadata, exportación o soporte futuro.
project.selector.repositoryPath=target/ui-mapper/selectors
project.selector.specPath=target/ui-mapper/specs


# ==========================================================
# AUTODESCUBRIMIENTO
# ==========================================================
# Paquete Java donde se generarán los scripts de autodiscovery.
project.autodesc.packageName=com.miempresa.demo.autodesc

# Directorio base de salida para scripts de autodiscovery.
project.autodesc.outputDirectory=src/test/java

# Sufijo de clase para scripts generados de autodiscovery.
project.autodesc.classNameSuffix=_JUNIT_SELENIUM


# ==========================================================
# POM GENERATION
# ==========================================================
# Paquete Java donde se generarán las clases POM.
project.pom.packageName=com.miempresa.demo.pom

# Directorio base de salida para clases POM.
project.pom.outputDirectory=src/test/java


# ==========================================================
# BUSINESS GENERATION
# ==========================================================
# Carpeta donde se colocan los .feature de negocio.
project.business.features.directory=src/test/resources/features/business

# Paquete Java donde se generarán los scripts de negocio.
project.business.packageName=com.miempresa.demo.business

# Directorio base de salida para scripts de negocio.
project.business.outputDirectory=src/test/java

# Sufijo de clase para scripts generados de negocio.
project.business.classNameSuffix=_JUNIT_SELENIDE

# ==================================================
# BUSINESS - QA MONITORING GENERATION
# ==================================================

# true  = Genera scripts Business con QA Monitoring
# false = Genera scripts Business tradicionales
project.business.monitoring.generate=true

# Severidad predeterminada para los flujos generados
project.business.monitoring.severity=BLOCKER


# ==========================================================
# TIMEOUTS / ESPERAS
# ==========================================================
# Tiempo implícito Selenium para scripts de autodiscovery.
project.selenium.implicitWaitSeconds=60

# Timeout principal de Selenide para scripts de negocio.
project.selenide.timeoutMs=60000

# Timeout de carga de página de Selenide.
project.selenide.pageLoadTimeoutMs=60000



# ============================================================
# QA MONITORING
# ============================================================

# Activa o desactiva el envío de información a QA Monitoring.
# true  = envía evidencias y resultados al servicio.
# false = ejecuta el flujo sin enviar información a QA Monitoring.
qamonitoring.enabled=true

# URL del endpoint de QA Monitoring que recibe los resultados
# y evidencias generadas durante la ejecución de los scripts.
qamonitoring.server.url=http://192.168.100.200:8080/UPLOAD/monitoring/mon_ext/insertaRegistro

# Ruta local donde se almacenan temporalmente las evidencias
# generadas por los scripts, por ejemplo capturas de pantalla.
qamonitoring.evidence.path=/tmp/

# Ambiente donde se está ejecutando el flujo automatizado.
# Ejemplos: QA, PROD.
qamonitoring.environment=QA

# Canal tecnológico al que pertenece el flujo.
# Para scripts generados por UI_MAPPER actualmente se utiliza WEB.
qamonitoring.channel=WEB

# Código del tenant/cliente al que pertenece el proyecto.
# Debe reemplazarse por el tenant correspondiente al crear
# o configurar un nuevo proyecto consumidor.
qamonitoring.tenantCode=TENANT_CAMBIAR





# ==========================================================
# BUSINESS PAGE ALIASES
# ==========================================================
# Mapeo:
# alias lógico del DSL de negocio -> clase POM real
#
# Estos valores normalmente se generan con:
# RunBusinessAliasGeneration
#
# Ejemplo:
# project.business.page.LOGIN=FeaturesAuthLoginPage


# ==========================================================
# BUSINESS ELEMENT ALIASES
# ==========================================================
# Mapeo:
# PAGE_ALIAS.elementAlias -> logicalId
#
# Estos valores normalmente se generan con:
# RunBusinessAliasGeneration
#
# Ejemplo:
# project.business.element.LOGIN.loginButton=FEATURES_LAYOUT_AUTH_LOGIN.LOG_IN_BUTTON